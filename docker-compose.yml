services:
  web:
    build: ./app
    container_name: web_bukutamu
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_NAME=bukutamu_db
    depends_on:
      - db
    networks:
      - bukutamu-net

  db:
    image: mysql:8.0
    container_name: db_bukutamu
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: bukutamu_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - bukutamu-net

volumes:
  db_data:

networks:
  bukutamu-net:
    driver: bridge

